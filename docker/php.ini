; Ajustes de PHP para producción (se suman al php.ini-production de la imagen)

; Fotos de hasta 4 MB (portada) y planillas de importación
upload_max_filesize = 8M
post_max_size = 10M

; GD arma la historia (1080x1920) y el catálogo en memoria
memory_limit = 512M

; Precompila el PHP: el código no cambia mientras corre el contenedor
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

expose_php = Off
